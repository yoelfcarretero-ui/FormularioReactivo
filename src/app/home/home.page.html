<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Gestión de Inventario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="productoForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">

      <ion-item>
        <ion-input label="Código de barras (SKU)" labelPlacement="floating"
          type="text" maxlength="12" formControlName="sku"
          [errorText]="errorSku"></ion-input>
      </ion-item>

      <ion-item>
        <ion-input label="Nombre del producto" labelPlacement="floating"
          type="text" formControlName="nombre"
          errorText="El nombre es obligatorio."></ion-input>
      </ion-item>

      <ion-item>
        <ion-select label="Categoría" labelPlacement="floating"
          formControlName="categoria" interface="popover">
          @for (c of categorias; track c) {
            <ion-select-option [value]="c">{{ c }}</ion-select-option>
          }
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-input label="Stock mínimo" labelPlacement="floating"
          type="number" inputmode="numeric" formControlName="stockMinimo"
          [errorText]="errorStock"></ion-input>
      </ion-item>

      <!-- Campo nuevo -->
      <ion-item>
        <ion-input label="Fecha de nacimiento" labelPlacement="stacked"
          type="date" formControlName="fechaNacimiento"
          [errorText]="errorFecha"></ion-input>
      </ion-item>

    </ion-list>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit"
        [disabled]="productoForm.invalid || isSubmitting()">
        @if (!isSubmitting()) { <span>Guardar producto</span> }
        @else { <ion-spinner name="crescent"></ion-spinner> }
      </ion-button>
    </div>
  </form>

  <ion-toast [isOpen]="toastAbierto()" message="Producto guardado localmente"
    [duration]="2500" color="success" position="bottom"
    (didDismiss)="toastAbierto.set(false)"></ion-toast>
</ion-content>
